<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Key Features Implemented</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f3f4f6;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      .slide-container {
        width: 80%;
        height: 85%;
        background-color: #ffffff;
        border-radius: 1rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        padding: 2rem 2.5rem;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .slide-title {
        font-size: 2.5rem;
        font-weight: 700;
        text-align: center;
        color: #1e293b;
        margin-bottom: 1.5rem;
      }

      .grp-features {
        flex: 1;
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        gap: 2rem;
      }

      .grp-features::-webkit-scrollbar {
        display: none;
      }

      .feature {
        min-width: 100%;
        scroll-snap-align: start;
        flex-shrink: 0;
        text-align: center;
      }

      .head {
        font-size: 1.75rem;
        font-weight: 600;
        color: #374151;
        margin-bottom: 1rem;
      }

      img {
        max-height: 65vh; /* limits image height to 65% of viewport */
        width: auto;
        max-width: 90%;
        margin: 0 auto;
        object-fit: contain;
        border-radius: 0.5rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        border: 1px solid #ccc;
      }

      .dots {
        display: flex;
        justify-content: center;
        margin-top: 1rem;
        gap: 10px;
      }

      .dot {
        width: 12px;
        height: 12px;
        background-color: #d1d5db;
        border-radius: 50%;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .dot.active {
        background-color: #6b7280;
      }

      .button-container {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
        width: 100%;
        padding: 0 5%;
        position: absolute;
        left: 0;
        top: 49%;
        transform: translateY(-50%);
        box-sizing: border-box;
      }

      .nav-button {
        width: 48px;
        height: 48px;
        background-color: #b49778;
        border: none;
        color: white;
        font-size: 20px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s;
        margin: 0 30px; /* Added margin here */
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
      }

      .nav-button:hover {
        background-color: #91795f;
      }

      .prev-button {
        left: 0;
      }

      .next-button {
        right: 0;
      }
    </style>
  </head>
  <body>
    <div class="slide-container">
      <h1 class="slide-title">Key Features Implemented</h1>
      <div class="grp-features" id="featureContainer">
        <div class="feature">
          <h2 class="head">Game Setup</h2>
          <img src="images/game-setup.png" alt="Game Setup" />
        </div>
        <div class="feature">
          <h2 class="head">Place Tile</h2>
          <img src="images/place-tile.png" alt="Place Tile" />
        </div>
        <div class="feature">
          <h2 class="head">Hotel Chain Formation</h2>
          <img src="images/hotel-chain.png" alt="Hotel Chain" />
        </div>
        <div class="feature">
          <h2 class="head">Stock Purchase</h2>
          <img src="images/buy-stocks.png" alt="Stock Purchase" />
        </div>
        <div class="feature">
          <h2 class="head">Merging</h2>
          <img src="images/merging.png" alt="Merging" />
        </div>
      </div>
      <div class="dots" id="dotsContainer"></div>
    </div>

    <div class="button-container">
      <button class="nav-button prev-button" onclick="goToPreviousSlide()">
        ←
      </button>
      <button class="nav-button next-button" onclick="goToNextSlide()">
        →
      </button>
    </div>
    <script>
      function goToPreviousSlide() {
        window.location.href = "slide6.html";
      }
      function goToNextSlide() {
        window.location.href = "slide8.html";
      }
      document.addEventListener("keydown", function (event) {
        if (event.key === "ArrowRight") {
          goToNextSlide();
        }
        if (event.key === "ArrowLeft") {
          goToPreviousSlide();
        }
      });

      const container = document.getElementById("featureContainer");
      const dotsContainer = document.getElementById("dotsContainer");
      const features = document.querySelectorAll(".feature");

      features.forEach((_, index) => {
        const dot = document.createElement("div");
        dot.classList.add("dot");
        if (index === 0) dot.classList.add("active");
        dot.addEventListener("click", () => {
          container.scrollTo({
            left: index * container.clientWidth,
            behavior: "smooth",
          });
        });
        dotsContainer.appendChild(dot);
      });

      container.addEventListener("scroll", () => {
        const scrollLeft = container.scrollLeft;
        const index = Math.round(scrollLeft / container.clientWidth);
        document.querySelectorAll(".dot").forEach((dot, i) => {
          dot.classList.toggle("active", i === index);
        });
      });
    </script>
  </body>
</html>
