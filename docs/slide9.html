<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You – ACQUIRE</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background: linear-gradient(145deg, #f5f5f5, #e6e0d8);
        color: #1f2937;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        padding: 20px;
        position: relative;
        text-align: center;
      }

      .card {
        background-color: white;
        padding: 4rem 3rem;
        border-radius: 1rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        max-width: 700px;
      }

      .thank-you {
        font-family: "Playfair Display", serif;
        font-size: 64px;
        font-weight: 700;
        color: #91795f;
        margin-bottom: 1.5rem;
      }

      .subtitle {
        font-size: 22px;
        color: #555;
        font-style: italic;
        margin-bottom: 3rem;
      }

      .nav-button {
        width: 48px;
        height: 48px;
        background-color: #b49778;
        border: none;
        color: white;
        font-size: 20px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .nav-button:hover {
        background-color: #91795f;
      }

      .nav-buttons {
        position: absolute;
        top: 50%;
        left: 20px;
        transform: translateY(-50%);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="thank-you">Thank You</div>
      <div class="subtitle">To everyone who made this project possible.</div>
    </div>

    <div class="nav-buttons">
      <button class="nav-button" onclick="goToPreviousSlide()">←</button>
    </div>

    <script>
      function goToPreviousSlide() {
        window.location.href = "slide8.html";
      }

      document.addEventListener("keydown", function (event) {
        if (event.key === "ArrowLeft") {
          goToPreviousSlide();
        }
      });
    </script>
  </body>
</html>
